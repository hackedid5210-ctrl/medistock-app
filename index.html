<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#1565c0"/>
<title>MediStock Pro</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f2f5f9;--white:#fff;--border:#dde3ec;--border2:#c8d2e0;
--blue:#1565c0;--blue2:#1976d2;--blue3:#1e88e5;--bluebg:#e8f0fe;--bluetext:#0d47a1;
--green:#1b5e20;--green2:#2e7d32;--greenbg:#e8f5e9;--greentext:#1b5e20;
--amber:#e65100;--amberbg:#fff3e0;--ambertext:#bf360c;
--red:#b71c1c;--redbg:#ffebee;--redtext:#b71c1c;
--purple:#4527a0;--purplebg:#ede7f6;--purpletext:#4527a0;
--teal:#004d40;--tealbg:#e0f2f1;--tealtext:#004d40;
--text:#0f1923;--text2:#455a64;--text3:#78909c;
--sidebar:#0a1929;--sidebartext:rgba(255,255,255,.75);--sidebarborder:rgba(255,255,255,.08);
--r:9px;--rl:14px;--rx:20px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sb{width:228px;background:var(--sidebar);flex-shrink:0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sidebarborder)}
.sb-logo-icon{width:34px;height:34px;background:#1565c0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sb-logo-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sb-logo-ver{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 8px}
.sb-section{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.9px;padding:8px 8px 4px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sidebartext);font-size:13px;font-weight:500;transition:all .12s;margin-bottom:1px;position:relative}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:rgba(21,101,192,.4);color:#fff;font-weight:600}
.sb-item .ico{font-size:15px;width:18px;text-align:center;opacity:.85}
.sb-badge{margin-left:auto;background:#e53935;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.sb-footer{padding:10px 8px;border-top:1px solid var(--sidebarborder)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:8px;cursor:pointer}
.sb-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:10px;color:rgba(255,255,255,.4)}
.sb-logout{margin-left:auto;font-size:11px;color:rgba(255,255,255,.35);cursor:pointer;padding:3px 6px;border-radius:5px}
.sb-logout:hover{background:rgba(255,255,255,.1);color:#fff}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-title{font-size:15px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:12px;color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:8px}
.notif-btn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2)}
.notif-btn:hover{background:var(--bg)}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#e53935;border:2px solid var(--white)}
.content{flex:1;padding:22px;overflow-y:auto}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--blue2);color:#fff}
.btn-primary:hover{background:var(--blue)}
.btn-success{background:var(--green2);color:#fff}
.btn-success:hover{background:var(--green)}
.btn-outline{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--text2);border:none}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:var(--redbg);color:var(--red);border:1px solid #ffcdd2}
.btn-danger:hover{background:#ffcdd2}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:7px;justify-content:center}

/* CARDS */
.card{background:var(--white);border-radius:var(--rl);border:1px solid var(--border);padding:18px 20px}
.card-0{padding:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.pt{font-size:17px;font-weight:700;color:var(--text)}
.ps{font-size:12px;color:var(--text3);margin-top:2px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.st{font-size:13px;font-weight:700}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.stat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
.stat-lbl{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;line-height:1;margin-bottom:3px}
.stat-hint{font-size:11px;color:var(--text3)}
.bg-blue{background:var(--bluebg)} .bg-green{background:var(--greenbg)} .bg-amber{background:var(--amberbg)} .bg-red{background:var(--redbg)} .bg-purple{background:var(--purplebg)} .bg-teal{background:var(--tealbg)}
.c-blue{color:var(--blue2)} .c-green{color:var(--green2)} .c-amber{color:var(--amber)} .c-red{color:var(--red)} .c-purple{color:var(--purple)} .c-teal{color:var(--teal)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--greenbg);color:var(--greentext)}
.b-amber{background:var(--amberbg);color:var(--ambertext)}
.b-red{background:var(--redbg);color:var(--redtext)}
.b-blue{background:var(--bluebg);color:var(--bluetext)}
.b-gray{background:#f1f5f9;color:var(--text2)}
.b-purple{background:var(--purplebg);color:var(--purpletext)}
.b-teal{background:var(--tealbg);color:var(--tealtext)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
td{font-size:13px;color:var(--text);padding:10px 12px;border-bottom:1px solid #f2f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.td-em{font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:-.3px}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:12px;font-weight:600;color:var(--text2)}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--white);color:var(--text);outline:none;transition:border-color .12s,box-shadow .12s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(25,118,210,.1)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}

/* MODAL */
.mo{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;min-height:100vh}
.mo-box{background:var(--white);border-radius:var(--rl);width:100%;max-width:580px;max-height:85vh;overflow-y:auto}
.mo-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1}
.mo-title{font-size:16px;font-weight:700}
.mo-close{width:30px;height:30px;border:none;background:var(--bg);border-radius:7px;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.mo-body{padding:20px 22px}
.mo-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--white)}

/* ALERTS */
.alert{padding:10px 14px;border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:500}
.al-warn{background:var(--amberbg);color:var(--ambertext);border:1px solid #ffcc80}
.al-err{background:var(--redbg);color:var(--redtext);border:1px solid #ef9a9a}
.al-info{background:var(--bluebg);color:var(--bluetext);border:1px solid #90caf9}
.al-ok{background:var(--greenbg);color:var(--greentext);border:1px solid #a5d6a7}

/* MISC */
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.35}
.empty-txt{font-size:13px;font-weight:500}
.chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;background:var(--bluebg);color:var(--bluetext)}
.prog{height:5px;background:#e9edf2;border-radius:3px;overflow:hidden;width:60px;display:inline-block}
.prog-fill{height:100%;border-radius:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--white);flex:1;max-width:260px}
.search-wrap input{border:none;padding:8px 0;background:transparent}
.search-wrap input:focus{box-shadow:none}
select.fsel{width:auto;min-width:130px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
.profit-pos{color:var(--green2)} .profit-neg{color:var(--red)}
.highlight-box{border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.hb-blue{background:var(--bluebg)}
.hb-green{background:var(--greenbg)}
.hb-amber{background:var(--amberbg)}

/* RECEIPT */
.receipt{font-size:12px;line-height:1.6;max-width:340px;margin:0 auto}
.receipt-head{text-align:center;padding-bottom:10px;border-bottom:1px dashed var(--border2);margin-bottom:10px}
.receipt-store{font-size:16px;font-weight:700}
.receipt-row{display:flex;justify-content:space-between;padding:2px 0}
.receipt-dashed{border-bottom:1px dashed var(--border2);margin:8px 0}
.receipt-total{display:flex;justify-content:space-between;font-weight:700;font-size:14px}

/* DRAWER */
.drawer-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:150;display:flex;justify-content:flex-end}
.drawer{width:360px;background:var(--white);height:100%;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white)}
.drawer-body{padding:18px 20px}

/* TABS */
.tabs{display:flex;gap:2px;background:#eef2f7;padding:3px;border-radius:9px;width:fit-content;margin-bottom:16px}
.tab{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);border:none;background:transparent;font-family:inherit;transition:all .12s}
.tab.on{background:var(--white);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* LOGIN */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1929 0%,#1a237e 50%,#0d47a1 100%);position:relative;overflow:hidden}
.login-bg::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(25,118,210,.25),transparent 70%);top:-100px;right:-100px;border-radius:50%;animation:floatOrb 8s ease-in-out infinite}
.login-bg::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(100,181,246,.15),transparent 70%);bottom:-80px;left:-80px;border-radius:50%;animation:floatOrb 10s ease-in-out infinite reverse}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(25,118,210,.4)}50%{box-shadow:0 0 0 12px rgba(25,118,210,0)}}
.login-card{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:20px;padding:40px 36px;width:400px;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadeUp .6s ease-out}
.login-logo{width:56px;height:56px;background:linear-gradient(135deg,#1565c0,#42a5f5);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;animation:pulse 2s infinite}
.login-title{font-size:24px;font-weight:800;background:linear-gradient(135deg,#0d47a1,#1976d2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.login-sub{font-size:13px;color:#78909c;text-align:center;margin-top:4px;margin-bottom:24px}
.user-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s ease}
.user-card:hover{border-color:#90caf9;background:#e3f2fd;transform:translateX(4px)}
.user-card.selected{border-color:#1565c0;background:linear-gradient(135deg,#e3f2fd,#bbdefb);box-shadow:0 2px 8px rgba(21,101,192,.15)}
.login-btn{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.3px}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(21,101,192,.35)}
.login-btn:active{transform:translateY(0)}

/* CART */
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fafbfd}
.cart-item:hover{background:var(--bluebg)}
.cart-rm{width:24px;height:24px;border-radius:6px;border:none;background:var(--redbg);color:var(--red);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cart-rm:hover{background:#ffcdd2}
.cart-total{background:linear-gradient(135deg,#e3f2fd,#bbdefb);border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}

/* ACTIVITY */
.act-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f2f5f9}
.act-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.act-text{font-size:13px}
.act-time{font-size:11px;color:var(--text3);margin-top:2px}

/* PRINT */
@media print{.sb,.topbar,.no-print{display:none!important}.main{width:100%}.content{padding:0}}

/* NOTIFICATION PANEL */
.notif-panel{position:absolute;top:54px;right:16px;width:320px;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);z-index:300;overflow:hidden}
.np-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.np-item{padding:10px 16px;border-bottom:1px solid #f2f5f9;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.np-item:hover{background:var(--bg)}
.np-item:last-child{border-bottom:none}
.np-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.np-text{font-size:12px;color:var(--text)}
.np-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* MOBILE RESPONSIVENESS */
@media (max-width: 768px) {
  .sb { position: fixed; z-index: 1000; left: -100%; transition: left 0.3s ease; box-shadow: 4px 0 24px rgba(0,0,0,.5); width: 260px; max-width: 80%; }
  .sb.open { left: 0; }
  .sb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; }
  .menu-btn { display: flex !important; }
  .stats { grid-template-columns: 1fr 1fr; }
  .grid2, .grid3, .fgrid { grid-template-columns: 1fr; }
  .topbar { padding: 0 14px; }
  .content { padding: 14px; }
  .login-card { width: 90%; padding: 30px 24px; }
  .drawer { width: 100%; }
  .mo-box { max-height: 95vh; margin: 10px; width: calc(100% - 20px) !important; }
  .fbar { flex-direction: column; align-items: stretch; }
  .search-wrap { max-width: 100%; }
  .notif-panel { width: calc(100% - 28px); right: 14px; }
  .ph { flex-direction: column; align-items: flex-start; gap: 10px; }
  .ph > div:last-child { align-self: stretch; display: flex; }
  .ph > div:last-child > button { flex: 1; justify-content: center; }
  .stats > .stat { padding: 12px; }
}
.menu-btn { display: none; background: transparent; border: none; font-size: 20px; color: var(--text); cursor: pointer; padding: 4px 8px; margin-right: 8px; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root" style="position:relative;min-height:100vh"></div>
<script>
const {useState,useEffect,useRef,useCallback}=React;
const ce=React.createElement;

const TODAY=new Date();
const toStr=d=>{const D=new Date(d);return D.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const todayISO=TODAY.toISOString().split('T')[0];
const addDays=(base,n)=>{const d=new Date(base);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]};
const daysTo=d=>Math.ceil((new Date(d)-TODAY)/(86400000));
const cur=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?Math.round(a/b*100):0;

const CATS=['Analgesic','Antibiotic','Antidiabetic','Antihistamine','Cardiac','Dermatology','Gastrointestinal','Neurological','Ophthalmic','Respiratory','Vitamin & Supplement','Other'];
const FORMS=['Tablet','Capsule','Syrup','Injection','Cream','Ointment','Drop','Powder','Inhaler','Patch'];
const SUPPLIERS_INIT=[
  {id:1,name:'MedWholesale',contact:'Suresh Kumar',phone:'9876543210',email:'suresh@medwholesale.in',city:'Mumbai',gst:'27AABCM1234A1Z5',active:true},
  {id:2,name:'PharmaDist',contact:'Anita Rao',phone:'9123456789',email:'anita@pharmadist.in',city:'Delhi',gst:'07AABCP5678B2Z3',active:true},
  {id:3,name:'HealthSupply Co',contact:'Ravi Sharma',phone:'9988776655',email:'ravi@healthsupply.in',city:'Bangalore',gst:'29AABCH9012C3Z1',active:true},
  {id:4,name:'NationalMedical',contact:'Preeti Joshi',phone:'8877665544',email:'preeti@nationalmed.in',city:'Pune',gst:'27AAABCN3456D4Z9',active:true},
];

// ---- LOCALSTORAGE ----
function lsGet(key,def){try{const v=localStorage.getItem('msp_'+key);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(key,val){try{localStorage.setItem('msp_'+key,JSON.stringify(val))}catch(e){}}

// ---- CSV EXPORT ----
function exportCSV(filename,headers,rows){
  const csv=[headers.join(','),...rows.map(r=>r.map(c=>'"'+(c??'').toString().replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

function getStatus(m){
  if(daysTo(m.expiry)<=0)return'Expired';
  if(m.qty===0)return'Out of Stock';
  if(m.qty<=m.threshold)return'Low Stock';
  return'In Stock';
}
function StatusBadge({s}){
  const map={'In Stock':'b-green','Low Stock':'b-amber','Out of Stock':'b-red','Expired':'b-red'};
  return ce('span',{className:`badge ${map[s]||'b-gray'}`},ce('span',{className:'dot'}),s);
}

  const [edit,setEdit]=useState(null);
  const [q,setQ]=useState('');
  const [nextId,setNextId]=useState(customers.length+1);

  const list=customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q));

  function save(f){
    if(edit){setCustomers(p=>p.map(c=>c.id===edit.id?{...f,id:edit.id}:c))}
    else{setCustomers(p=>[...p,{...f,id:nextId,visits:0,totalSpent:0,lastVisit:''}]);setNextId(n=>n+1);}
    setModal(null);setEdit(null);
  }
  function doExport(){
    exportCSV('customers_'+todayISO+'.csv',
      ['Name','Phone','Email','Address','Visits','Total Spent','Last Visit'],
      list.map(c=>[c.name,c.phone,c.email,c.address,c.visits,c.totalSpent,c.lastVisit])
    );
  }

  return ce('div',null,
    ce('div',{className:'ph'},
      ce('div',null,ce('div',{className:'pt'},'Customers'),ce('div',{className:'ps'},`${customers.length} registered customers`)),
      ce('div',{style:{display:'flex',gap:8}},
        ce('button',{className:'btn btn-outline',onClick:doExport},'📥 Export'),
        ce('button',{className:'btn btn-primary',onClick:()=>{setEdit(null);setModal('add')}},'+ Add Customer')
      )
    ),
    ce('div',{className:'fbar'},
      ce('div',{className:'search-wrap'},ce('span',null,'🔍'),ce('input',{placeholder:'Search name or phone…',value:q,onChange:e=>setQ(e.target.value)}))
    ),
    ce('div',{className:'card card-0'},
      ce('div',{className:'tbl-wrap'},ce('table',null,
        ce('thead',null,ce('tr',null,ce('th',null,'Customer'),ce('th',null,'Phone'),ce('th',null,'Email'),ce('th',null,'Address'),ce('th',null,'Visits'),ce('th',null,'Total Spent'),ce('th',null,'Last Visit'),ce('th',null,'Actions'))),
        ce('tbody',null,list.length===0?ce('tr',null,ce('td',{colSpan:8,style:{textAlign:'center',padding:36,color:'var(--text3)'}},'No customers found')):
          list.map(c=>ce('tr',{key:c.id},
            ce('td',null,ce('div',{className:'td-em'},c.name)),
            ce('td',null,ce('span',{className:'mono'},c.phone)),
            ce('td',{style:{fontSize:12,color:'var(--blue2)'}},c.email||'—'),
            ce('td',{style:{fontSize:12}},c.address||'—'),
            ce('td',null,ce('span',{className:'badge b-blue'},c.visits)),
            ce('td',null,ce('strong',null,cur(c.totalSpent))),
            ce('td',{style:{fontSize:12,color:'var(--text3)'}},c.lastVisit?toStr(c.lastVisit):'—'),
            ce('td',null,ce('button',{className:'btn btn-outline btn-xs',onClick:()=>{setEdit(c);setModal('add')}},'Edit'))
          )))
      ))
    ),
    modal&&ce(CustomerModal,{onSave:save,onClose:()=>{setModal(null);setEdit(null)},edit})
  );
}

// ---- ACCOUNTS ----
function Accounts({users,setUsers,user}){
  const [modal,setModal]=useState(null);
  const [edit,setEdit]=useState(null);
  const isOwner = user.role === 'Owner';
  const list = isOwner ? users : users.filter(u=>u.id===user.id);
  
  function save(f){
    if(edit){setUsers(p=>p.map(u=>u.id===edit.id?{...u,...f}:u))}
    else{
      const maxId = users.reduce((a,u)=>Math.max(a,u.id),0);
      const colors=['#1565c0','#2e7d32','#6a1b9a','#e65100','#b71c1c','#004d40'];
      setUsers(p=>[...p,{...f,id:maxId+1,color:colors[maxId%colors.length]}]);
    }
    setModal(null);setEdit(null);
  }
  
  function del(id){
    if(users.length===1){alert('Cannot delete the last account');return;}
    if(id===user.id){alert('Cannot delete your own account while logged in');return;}
    if(confirm('Delete this account?')) setUsers(p=>p.filter(u=>u.id!==id));
  }

  return ce('div',null,
    ce('div',{className:'ph'},
      ce('div',null,ce('div',{className:'pt'},'User Accounts'),ce('div',{className:'ps'},'Manage users and permissions')),
      isOwner && ce('button',{className:'btn btn-primary',onClick:()=>{setEdit(null);setModal('add')}},'+ Add Account')
    ),
    ce('div',{className:'card card-0'},
      ce('div',{className:'tbl-wrap'},ce('table',null,
        ce('thead',null,ce('tr',null,ce('th',null,'Name'),ce('th',null,'Role'),ce('th',null,'Actions'))),
        ce('tbody',null,list.map(u=>ce('tr',{key:u.id},
          ce('td',null,
            ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
              ce('div',{style:{width:30,height:30,borderRadius:'50%',background:u.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:12}},u.name.charAt(0)),
              ce('div',{className:'td-em'},u.name)
            )
          ),
          ce('td',null,ce('span',{className:`badge ${u.role==='Owner'?'b-blue':'b-gray'}`},u.role)),
          ce('td',null,ce('div',{style:{display:'flex',gap:4}},
            ce('button',{className:'btn btn-outline btn-xs',onClick:()=>{setEdit(u);setModal('edit')}},'Edit'),
            isOwner && u.id!==user.id && ce('button',{className:'btn btn-danger btn-xs',onClick:()=>del(u.id)},'Delete')
          ))
        )))
      ))
    ),
    modal && ce(AccountModal,{onSave:save,onClose:()=>setModal(null),edit,isOwner,currentUser:user})
  );
}

// ---- SALE MODAL (MULTI-ITEM CART) ----
function SaleModal({meds,onSave,onClose,user,nextBill,customers}){
  const [q,setQ]=useState('');
  const [cart,setCart]=useState([]);
  const [customer,setCustomer]=useState('');
  const [custMode,setCustMode]=useState('existing');
  const [doctor,setDoctor]=useState('');
  const [discount,setDiscount]=useState(0);
  const [err,setErr]=useState('');
  const avail=meds.filter(m=>getStatus(m)!=='Expired'&&m.qty>0&&(q===''||m.name.toLowerCase().includes(q.toLowerCase())));

  function addToCart(m){
    const exists=cart.find(c=>c.medId===m.id);
    if(exists)return;
    setCart(p=>[...p,{medId:m.id,name:m.name,price:m.price,qty:1,maxQty:m.qty,batch:m.batch}]);
    setQ('');
  }
  function updateQty(medId,val){setCart(p=>p.map(c=>c.medId===medId?{...c,qty:Math.min(Math.max(1,Number(val)),c.maxQty)}:c))}
  function removeItem(medId){setCart(p=>p.filter(c=>c.medId!==medId))}

  const subtotal=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const disc=subtotal*discount/100;
  const total=subtotal-disc;

  function save(){
    if(cart.length===0){setErr('Add at least one medicine to cart');return;}
    const items=cart.map(c=>({medId:c.medId,medName:c.name,qty:c.qty,price:c.price}));
    onSave({items,total:Math.round(total*100)/100,soldBy:user.name,date:todayISO,customer,doctor,discount:Number(discount),billNo:nextBill});
    onClose();
  }

  return ce(Modal,{title:'Point of Sale',onClose,wide:true,footer:ce(React.Fragment,null,
    ce('div',{style:{flex:1,fontSize:12,color:'var(--text3)'}},`${cart.length} item(s) in cart`),
    ce('button',{className:'btn btn-outline',onClick:onClose},'Cancel'),
    ce('button',{className:'btn btn-primary',onClick:save},'💰 Complete Sale')
  )},
    ce('div',{className:'grid2'},
      ce('div',null,
        ce('div',{style:{fontWeight:700,fontSize:13,marginBottom:8}},'Add Medicines'),
        ce('div',{className:'search-wrap',style:{maxWidth:'100%',marginBottom:8}},ce('span',null,'🔍'),ce('input',{placeholder:'Search medicine…',value:q,onChange:e=>setQ(e.target.value)})),
        q&&ce('div',{style:{maxHeight:140,overflowY:'auto',border:'1px solid var(--border)',borderRadius:9,marginBottom:8}},
          avail.length===0?ce('div',{style:{padding:'10px 14px',color:'var(--text3)',fontSize:12}},'No available medicines'):
          avail.slice(0,6).map(m=>ce('div',{key:m.id,style:{padding:'8px 14px',cursor:'pointer',borderBottom:'1px solid #f2f5f9',fontSize:12},onClick:()=>addToCart(m)},
            ce('div',{style:{display:'flex',justifyContent:'space-between'}},ce('span',{style:{fontWeight:600}},m.name),ce('span',{style:{color:'var(--green2)'}},'+ Add')),
            ce('div',{style:{fontSize:11,color:'var(--text3)'}},`Stock: ${m.qty} · ${cur(m.price)}`)
          ))
        ),
        ce('div',{className:'divider'}),
        ce('div',{style:{fontWeight:700,fontSize:13,marginBottom:8}},'Customer & Doctor'),
        ce('div',{className:'fg'},ce('label',null,'Customer'),
          ce('div',{style:{display:'flex',gap:6,marginBottom:6}},
            ce('button',{className:`btn btn-xs ${custMode==='existing'?'btn-primary':'btn-outline'}`,onClick:()=>setCustMode('existing')},'Existing'),
            ce('button',{className:`btn btn-xs ${custMode==='new'?'btn-primary':'btn-outline'}`,onClick:()=>setCustMode('new')},'Walk-in / New')
          ),
          custMode==='existing'?
            ce('select',{value:customer,onChange:e=>setCustomer(e.target.value)},ce('option',{value:''},'-- Walk-in --'),...(customers||[]).map(c=>ce('option',{key:c.id,value:c.name},`${c.name} · ${c.phone}`))):
            ce('input',{placeholder:'Customer name',value:customer,onChange:e=>setCustomer(e.target.value)})
        ),
        ce('div',{className:'fg'},ce('label',null,'Prescribing Doctor (optional)'),ce('input',{placeholder:'Dr. Name',value:doctor,onChange:e=>setDoctor(e.target.value)})),
        ce('div',{className:'fg'},ce('label',null,'Overall Discount %'),ce('input',{type:'number',min:0,max:100,value:discount,onChange:e=>setDiscount(e.target.value)}))
      ),
      ce('div',null,
        ce('div',{style:{fontWeight:700,fontSize:13,marginBottom:8}},'Cart ({0} items)'.replace('{0}',cart.length)),
        cart.length===0?ce('div',{style:{padding:'30px 20px',textAlign:'center',color:'var(--text3)',fontSize:13,border:'2px dashed var(--border)',borderRadius:10}},'🛒 Search and add medicines'):
        cart.map(c=>ce('div',{key:c.medId,className:'cart-item'},
          ce('div',{style:{flex:1}},ce('div',{style:{fontWeight:600,fontSize:13}},c.name),ce('div',{style:{fontSize:11,color:'var(--text3)'}},`${cur(c.price)} × ${c.qty} = ${cur(c.price*c.qty)}`)),
          ce('input',{type:'number',min:1,max:c.maxQty,value:c.qty,onChange:e=>updateQty(c.medId,e.target.value),style:{width:56,textAlign:'center',padding:'4px 6px'}}),
          ce('button',{className:'cart-rm',onClick:()=>removeItem(c.medId)},'✕')
        )),
        ce('div',{className:'cart-total'},
          ce('div',null,
            ce('div',{style:{fontSize:12,color:'var(--bluetext)'}},`Subtotal: ${cur(subtotal)}`),
            discount>0&&ce('div',{style:{fontSize:11,color:'var(--green2)'}},'Discount ('+discount+'%): -'+cur(disc))
          ),
          ce('span',{style:{fontSize:24,fontWeight:800,color:'var(--bluetext)'}},cur(total))
        ),
        ce('div',{style:{fontSize:11,color:'var(--text3)',marginTop:8,textAlign:'right'}},'Bill No: '+nextBill),
        err&&ce('div',{style:{color:'var(--red)',fontSize:12,marginTop:8}},err)
      )
    )
  );
}

function PurchaseModal({meds,suppliers,onSave,onClose,user,prefillMed}){

  const selMed=meds.find(m=>m.id===Number(f.medId));
  const selSup=suppliers.find(s=>s.id===Number(f.supplier));
  function save(){
    if(!f.medId||!f.supplier){setErr('Select medicine and supplier');return;}

      ce('div',{className:'fg'},ce('label',null,'Expiry Date'),ce('input',{type:'date',value:f.expiry,onChange:set('expiry')})),
      selMed&&ce('div',{className:'fg full'},ce('div',{style:{background:'var(--greenbg)',borderRadius:9,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
        ce('div',null,ce('div',{style:{fontSize:12,color:'var(--greentext)'}},'Current stock: '+selMed.qty+' → After purchase: '+(selMed.qty+Number(f.qty||0))),selMed.qty<=selMed.threshold&&ce('div',{style:{fontSize:11,color:'var(--amber)',fontWeight:600}},'⚠ Was below threshold ('+selMed.threshold+')')),

      )),
      err&&ce('div',{className:'fg full'},ce('div',{style:{color:'var(--red)',fontSize:12}},err))

      ce('div',{className:'fg'},ce('label',null,'Quantity in Stock *'),ce('input',{type:'number',min:0,value:f.qty,onChange:set('qty')})),
      ce('div',{className:'fg'},ce('label',null,'Expiry Date'),ce('input',{type:'date',value:f.expiry,onChange:set('expiry')})),
      ce('div',{className:'fg'},ce('label',null,'Low Stock Threshold'),ce('input',{type:'number',min:1,value:f.threshold,onChange:set('threshold')})),
      err&&ce('div',{className:'fg full'},ce('div',{style:{color:'var(--red)',fontSize:12}},err))
    )
  );
}

// ---- MED DRAWER ----
function MedDrawer({med,sales,purchases,onClose}){
  const medSales=[...sales].filter(s=>s.medId===med.id).reverse();
  const medPurchases=[...purchases].filter(p=>p.medId===med.id).reverse();
  const totalSold=medSales.reduce((a,s)=>a+s.total,0);
  const totalCost=medSales.reduce((a,s)=>a+med.cost*s.qty,0);
  const margin=med.price>0?Math.round((med.price-med.cost)/med.price*100):0;
  const status=getStatus(med);

  return ce('div',{className:'drawer-overlay',onClick:e=>{if(e.target.className==='drawer-overlay')onClose()}},
    ce('div',{className:'drawer'},
      ce('div',{className:'drawer-head'},
        ce('div',null,ce('div',{style:{fontWeight:700,fontSize:15}},med.name),ce('div',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},med.manufacturer+' · '+med.batch)),
        ce('button',{className:'mo-close',onClick:onClose},'✕')
      ),
      ce('div',{className:'drawer-body'},
        ce('div',{style:{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}},
          ce(StatusBadge,{s:status}),
          ce('span',{className:'badge b-blue'},med.form||'Tablet'),
          ce('span',{className:'chip'},med.category)
        ),
        ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}},
          ce('div',{className:'stat',style:{padding:'10px 12px'}},ce('div',{className:'stat-lbl'},'Current Stock'),ce('div',{style:{fontSize:20,fontWeight:700,color:med.qty<=med.threshold?'var(--red)':'var(--text)'}},med.qty)),
          ce('div',{className:'stat',style:{padding:'10px 12px'}},ce('div',{className:'stat-lbl'},'Threshold'),ce('div',{style:{fontSize:20,fontWeight:700}},med.threshold)),
          ce('div',{className:'stat',style:{padding:'10px 12px'}},ce('div',{className:'stat-lbl'},'Cost Price'),ce('div',{style:{fontSize:15,fontWeight:700,color:'var(--amber)'}},cur(med.cost))),
          ce('div',{className:'stat',style:{padding:'10px 12px'}},ce('div',{className:'stat-lbl'},'Selling Price'),ce('div',{style:{fontSize:15,fontWeight:700,color:'var(--green2)'}},cur(med.price)))
        ),
        ce('div',{style:{background:'var(--bg)',borderRadius:9,padding:'10px 12px',marginBottom:16}},
          ce('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'Profit Margin'),ce('span',{style:{fontWeight:700,color:margin>=25?'var(--green2)':'var(--amber)'}},margin+'%')),
          ce('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'Expiry'),ce('span',{style:{fontSize:12,fontWeight:600,color:daysTo(med.expiry)<=0?'var(--red)':daysTo(med.expiry)<=30?'var(--amber)':'var(--text)'}},toStr(med.expiry)+(daysTo(med.expiry)>0?' ('+daysTo(med.expiry)+'d)':' EXPIRED'))),
          ce('div',{style:{display:'flex',justifyContent:'space-between'}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'HSN Code'),ce('span',{className:'mono',style:{fontSize:12}},med.hsn||'—'))
        ),
        ce('div',{className:'divider'}),
        ce('div',{style:{marginBottom:12}},
          ce('div',{style:{fontWeight:700,fontSize:13,marginBottom:8}},'Sales Performance'),
          ce('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'Total Revenue'),ce('span',{style:{fontWeight:600,color:'var(--blue2)'}},cur(totalSold))),
          ce('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'Total Profit'),ce('span',{style:{fontWeight:600,color:'var(--green2)'}},cur(totalSold-totalCost))),
          ce('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0'}},ce('span',{style:{fontSize:12,color:'var(--text3)'}},'Transactions'),ce('span',{style:{fontWeight:600}},medSales.length))
        ),
        medSales.length>0&&ce('div',null,
          ce('div',{style:{fontWeight:700,fontSize:13,marginBottom:8}},'Recent Sales'),
          medSales.slice(0,4).map(s=>ce('div',{key:s.id,style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #f2f5f9',fontSize:12}},
            ce('div',null,ce('div',null,s.billNo),ce('div',{style:{color:'var(--text3)',fontSize:11}},toStr(s.date))),
            ce('div',{style:{textAlign:'right'}},ce('div',{style:{fontWeight:600}},cur(s.total)),ce('div',{style:{color:'var(--text3)',fontSize:11}},s.qty+' units'))
          ))
        )
      )
    )
  );
}

// ---- NOTIFICATIONS ----
function Notifications({meds,onClose}){
  const items=[];
  meds.filter(m=>daysTo(m.expiry)<=0).forEach(m=>items.push({type:'red',text:m.name+' has expired',sub:toStr(m.expiry)}));
  meds.filter(m=>{const d=daysTo(m.expiry);return d>0&&d<=15}).forEach(m=>items.push({type:'red',text:m.name+' expiring very soon',sub:daysTo(m.expiry)+'d left'}));
  meds.filter(m=>{const d=daysTo(m.expiry);return d>15&&d<=30}).forEach(m=>items.push({type:'amber',text:m.name+' expiring in '+daysTo(m.expiry)+' days',sub:toStr(m.expiry)}));
  meds.filter(m=>m.qty===0).forEach(m=>items.push({type:'red',text:m.name+' is out of stock',sub:'Threshold: '+m.threshold}));
  meds.filter(m=>m.qty>0&&m.qty<=m.threshold).forEach(m=>items.push({type:'amber',text:m.name+' is running low',sub:'Stock: '+m.qty+' / Threshold: '+m.threshold}));

  return ce('div',{className:'notif-panel'},
    ce('div',{className:'np-head'},'Notifications ('+items.length+')',ce('button',{className:'mo-close',onClick:onClose},'✕')),
    items.length===0?ce('div',{style:{padding:'20px 16px',fontSize:13,color:'var(--text3)',textAlign:'center'}},'No alerts. All good! ✓'):
    items.map((n,i)=>ce('div',{key:i,className:'np-item'},
      ce('div',{className:'np-dot',style:{background:n.type==='red'?'var(--red)':'var(--amber)'}}),
      ce('div',null,ce('div',{className:'np-text'},n.text),ce('div',{className:'np-sub'},n.sub))
    ))
  );
}

// ---- APP ----
function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');
  const [modal,setModal]=useState(null);
  const [modalArgs,setModalArgs]=useState({});
  const [drawer,setDrawer]=useState(null);
  const [drawerData,setDrawerData]=useState(null);
  const [meds,setMeds]=useState(()=>lsGet('meds',MEDS));
  const [sales,setSales]=useState(()=>lsGet('sales',SALES_INIT));
  const [purchases,setPurchases]=useState(()=>lsGet('purchases',PURCHASES_INIT));
  const [returns,setReturns]=useState(()=>lsGet('returns',RETURNS_INIT));
  const [suppliers,setSuppliers]=useState(()=>lsGet('suppliers',SUPPLIERS_INIT));
  const [customers,setCustomers]=useState(()=>lsGet('customers',CUSTOMERS_INIT));
  const [settings,setSettings]=useState(()=>lsGet('settings',INIT_SETTINGS));
  const [activity,setActivity]=useState(()=>lsGet('activity',ACTIVITY_INIT));
  const [nextIds,setNextIds]=useState(()=>lsGet('nextIds',{med:MEDS.length+1,sale:SALES_INIT.length+1,purchase:PURCHASES_INIT.length+1}));
  const [notifOpen,setNotifOpen]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [users,setUsers]=useState(()=>lsGet('users',USERS_INIT));

  // Persist all data to localStorage
  useEffect(()=>{lsSet('users',users)},[users]);
  useEffect(()=>{if(user){const u=users.find(x=>x.id===user.id);if(u&&JSON.stringify(u)!==JSON.stringify(user))setUser(u)}},[users,user]);
  useEffect(()=>{lsSet('meds',meds)},[meds]);
  useEffect(()=>{lsSet('sales',sales)},[sales]);
  useEffect(()=>{lsSet('purchases',purchases)},[purchases]);
  useEffect(()=>{lsSet('returns',returns)},[returns]);
  useEffect(()=>{lsSet('suppliers',suppliers)},[suppliers]);
  useEffect(()=>{lsSet('customers',customers)},[customers]);
  useEffect(()=>{lsSet('settings',settings)},[settings]);
  useEffect(()=>{lsSet('activity',activity)},[activity]);
  useEffect(()=>{lsSet('nextIds',nextIds)},[nextIds]);

  if(!user)return ce(Login,{users,onLogin:u=>{setUser(u);setView('dashboard')}});

  const alerts=meds.filter(m=>['Low Stock','Out of Stock','Expired'].includes(getStatus(m))||daysTo(m.expiry)<=30);

  function openModal(type,args={}){setModal(type);setModalArgs(args);}
  function openDrawer(type,data){setDrawer(type);setDrawerData(data);}
  function addLog(type,text){setActivity(p=>[{id:p.length+1,type,text,time:todayISO,by:user.name},...p].slice(0,50));}

  function saveSale(s){
    // Multi-item cart: s.items is an array
    const saleRecord={...s,id:nextIds.sale,medName:s.items.map(i=>i.medName).join(', '),qty:s.items.reduce((a,i)=>a+i.qty,0)};
    setSales(p=>[...p,saleRecord]);
    setNextIds(n=>({...n,sale:n.sale+1}));
    // Deduct stock for each item
    setMeds(p=>{
      let updated=[...p];
      s.items.forEach(item=>{updated=updated.map(m=>m.id===item.medId?{...m,qty:m.qty-item.qty}:m)});
      return updated;
    });
    // Update customer stats
    if(s.customer){
      setCustomers(p=>{
        const exists=p.find(c=>c.name===s.customer);
        if(exists)return p.map(c=>c.name===s.customer?{...c,visits:c.visits+1,totalSpent:c.totalSpent+s.total,lastVisit:todayISO}:c);
        return p;
      });
    }
    addLog('sale',`Sale ${s.billNo} — ${s.items.map(i=>i.medName).join(', ')} — ${cur(s.total)}`);
  }
  function savePurchase(p){
    setPurchases(prev=>[...prev,{...p,id:nextIds.purchase}]);
    setNextIds(n=>({...n,purchase:n.purchase+1}));
    setMeds(prev=>prev.map(m=>m.id===p.medId?{...m,qty:m.qty+p.qty,batch:p.batch,expiry:p.expiry}:m));
    addLog('purchase',`Purchased ${p.qty} × ${p.medName} from ${p.supplierName}`);
  }
  function saveMed(m){
    if(modalArgs.med){setMeds(p=>p.map(x=>x.id===modalArgs.med.id?{...m,id:modalArgs.med.id}:x));addLog('edit','Edited medicine: '+m.name);}
    else{setMeds(p=>[...p,{...m,id:nextIds.med}]);setNextIds(n=>({...n,med:n.med+1}));addLog('add','Added new medicine: '+m.name);}
  }

  const nextBill='BL-'+String(nextIds.sale).padStart(4,'0');

  const nav=[
    {key:'dashboard',icon:'📊',label:'Dashboard',group:'main'},
    {key:'inventory',icon:'💊',label:'Inventory',group:'main'},
    {key:'analytics',icon:'📈',label:'Analytics',group:'main'},
    {key:'sales',icon:'🧾',label:'Sales',group:'records'},
    {key:'purchases',icon:'📦',label:'Purchases',group:'records'},
    {key:'returns',icon:'↩️',label:'Returns',group:'records'},
    {key:'customers',icon:'👥',label:'Customers',group:'manage'},
    {key:'suppliers',icon:'🏭',label:'Suppliers',group:'manage'},
    {key:'accounts',icon:'🔐',label:'Accounts',group:'manage'},
    {key:'settings',icon:'⚙️',label:'Settings',group:'manage'},
  ];

  return ce('div',{className:'app'},
    menuOpen&&ce('div',{className:'sb-overlay',onClick:()=>setMenuOpen(false)}),
    ce('aside',{className:`sb${menuOpen?' open':''}`},
      ce('div',{className:'sb-logo'},
        ce('div',{className:'sb-logo-icon'},'💊'),
        ce('div',null,ce('div',{className:'sb-logo-name'},'MediStock Pro'),ce('div',{className:'sb-logo-ver'},'v3.0'))
      ),
      ce('div',{className:'sb-scroll'},
        ['main','records','manage'].map(group=>{
          const items=nav.filter(n=>n.group===group);
          const labels={main:'Overview',records:'Transactions',manage:'Management'};
          return ce(React.Fragment,{key:group},
            ce('div',{className:'sb-section'},labels[group]),
            items.map(n=>ce('div',{key:n.key,className:`sb-item${view===n.key?' active':''}`,onClick:()=>{setView(n.key);setMenuOpen(false);}},
              ce('span',{className:'ico'},n.icon),n.label,
              n.key==='inventory'&&alerts.length>0&&ce('span',{className:'sb-badge'},alerts.length)
            ))
          );
        }),
        ce('div',{className:'sb-section'},'Quick Actions'),
        ce('div',{className:'sb-item',onClick:()=>{openModal('sale');setMenuOpen(false);}},ce('span',{className:'ico'},'💰'),'New Sale (POS)'),
        ce('div',{className:'sb-item',onClick:()=>{openModal('purchase');setMenuOpen(false);}},ce('span',{className:'ico'},'🚚'),'Record Purchase'),
        user.role==='Owner'&&ce('div',{className:'sb-item',onClick:()=>{openModal('addMed');setMenuOpen(false);}},ce('span',{className:'ico'},'➕'),'Add Medicine')
      ),
      ce('div',{className:'sb-footer'},
        ce('div',{className:'sb-user',onClick:()=>setView('accounts')},
          ce('div',{className:'sb-avatar',style:{background:user.color}},user.name.charAt(0)),
          ce('div',{style:{flex:1,minWidth:0}},ce('div',{className:'sb-uname'},user.name),ce('div',{className:'sb-urole'},user.role)),
          ce('div',{className:'sb-logout',onClick:(e)=>{e.stopPropagation();setUser(null)},title:'Sign Out'},'↩')
        )
      )
    ),
    ce('div',{className:'main'},
      ce('div',{className:'topbar'},
        ce('div',{className:'topbar-left'},
          ce('button',{className:'menu-btn',onClick:()=>setMenuOpen(true)},'☰'),
          ce('div',null,
            ce('div',{className:'topbar-title'},{dashboard:'Dashboard',inventory:'Inventory',analytics:'Analytics',sales:'Sales History',purchases:'Purchase History',returns:'Returns',customers:'Customers',suppliers:'Suppliers',accounts:'Accounts',settings:'Settings'}[view]),
            ce('div',{className:'topbar-sub'},settings.storeName)
          )
        ),
        ce('div',{className:'topbar-right'},
          ce('div',{style:{position:'relative'}},
            ce('div',{className:'notif-btn',onClick:()=>setNotifOpen(p=>!p)},'🔔',alerts.length>0&&ce('div',{className:'notif-dot'})),
            notifOpen&&ce(Notifications,{meds,onClose:()=>setNotifOpen(false)})
          ),
          ce('span',{className:'badge b-blue',style:{padding:'5px 10px'}},user.role)
        )
      ),
      ce('div',{className:'content'},
        view==='dashboard'&&ce(Dashboard,{meds,sales,purchases,setView,openModal,settings,user}),
        view==='inventory'&&ce(Inventory,{meds,setMeds,openModal,openDrawer,user}),
        view==='analytics'&&ce(Analytics,{sales,meds,purchases}),
        view==='sales'&&ce(Sales,{sales,meds,openModal,settings}),
        view==='purchases'&&ce(Purchases,{purchases,openModal}),
        view==='returns'&&ce(Returns,{returns,setReturns,sales,meds,setMeds,user}),
        view==='customers'&&ce(Customers,{customers,setCustomers,sales}),
        view==='suppliers'&&ce(Suppliers,{suppliers,setSuppliers,user}),
        view==='accounts'&&ce(Accounts,{users,setUsers,user}),
        view==='settings'&&ce(Settings,{settings,setSettings,user})
      )
    ),
    modal==='sale'&&ce(SaleModal,{meds,onSave:saveSale,onClose:()=>setModal(null),user,nextBill,customers}),
    modal==='purchase'&&ce(PurchaseModal,{meds,suppliers,onSave:savePurchase,onClose:()=>setModal(null),user,prefillMed:modalArgs.prefillMed}),
    (modal==='addMed'||modal==='editMed')&&ce(MedModal,{onSave:m=>{saveMed(m);setModal(null)},onClose:()=>setModal(null),suppliers,edit:modalArgs.med||null}),
    drawer==='med'&&drawerData&&ce(MedDrawer,{med:drawerData,sales,purchases,onClose:()=>setDrawer(null)})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(ce(App));
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('ServiceWorker registered:', reg))
      .catch(err => console.log('ServiceWorker registration failed:', err));
  });
}
</script>
